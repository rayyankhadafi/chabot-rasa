version: "3.1"

nlu:

# =========================
# INHAL PRAKTIKUM
# =========================
- intent: tanya_inhal_praktikum
  examples: |
    - Bagaimana cara mengikuti inhal?
    - Bagaimana cara membayar inhal?
    - Apakah bisa susulan jika tidak hadir praktikum?
    - Jika tidak hadir praktikum karena sakit apakah tetap membayar inhal?
    - Bagaimana jika tidak hadir praktikum karena ada musibah?
    - Jika absensi praktikum melebihi batas apakah masih bisa diperbaiki?
    - Bagaimana jika saya tidak hadir karena lupa praktikum?
    - Jika tidak hadir praktikum sampai melebihi batas hadir apa konsekuensinya?
    - Apa prosedur untuk mengikuti inhal praktikum?
    - Bagaimana alur pengajuan inhal praktikum?
    - Jika absen praktikum melewati ketentuan apakah harus inhal?
    - Apakah pembayaran inhal dilakukan sebelum mengikuti praktikum pengganti?
    - Saya ingin mengurus inhal karena tidak masuk praktikum
    - Bagaimana ketentuan inhal untuk mahasiswa yang tidak hadir praktikum?
    - Kalau jumlah absen praktikum terlalu banyak apakah ada inhal?
    - Apakah inhal praktikum bisa diajukan setelah jadwal utama selesai?

# =========================
# JADWAL PRAKTIKUM
# =========================
- intent: tanya_jadwal_praktikum
  examples: |
    - Bisa pindah jadwal?
    - Bagaimana jika bentrok jadwal praktikum?
    - Dimana saya bisa melihat jadwal praktikum terbaru?
    - Kapan jadwal praktikum diumumkan?
    - Bagaimana cara mengganti jadwal praktikum?
    - Apakah jadwal praktikum bisa diubah?
    - Bagaimana jika jadwal praktikum bentrok dengan kuliah?
    - Jadwal praktikum bisa dilihat dimana?
    - Kapan praktikum dimulai?
    - Praktikum semester ini dimulai kapan?
    - Tanggal mulai praktikum diumumkan di mana?
    - Jadwal awal praktikum dapat dilihat lewat apa?
    - Kapan pertemuan pertama praktikum dilaksanakan?
    - Apakah informasi mulai praktikum sudah tersedia?

# =========================
# ATURAN PRAKTIKUM
# =========================
- intent: tanya_aturan_praktikum
  examples: |
    - Ketika praktikum boleh bawa hp ngak?
    - Apakah ketika praktikum boleh membuka browser?
    - Apakah ketika praktikum boleh bekerja sama dengan teman?
    - Apakah boleh membuka internet saat praktikum?
    - Apakah boleh menggunakan ChatGPT saat praktikum?
    - Bagaimana aturan praktikum di laboratorium?
    - Apa saja tata tertib praktikum?
    - Apakah praktikum harus dikerjakan sendiri?
    - Apakah boleh membawa hp saat praktikum?
    - Bolehkah kerja kelompok saat praktikum?
    - Apa aturan ketika praktikum berlangsung?

# =========================
# KEHADIRAN PRAKTIKUM
# =========================
- intent: tanya_kehadiran_praktikum
  examples: |
    - Minimal kehadiran praktikum berapa?
    - Apakah wajib ikut semua pertemuan praktikum?
    - Bagaimana aturan jika tidak hadir praktikum tanpa keterangan?
    - Jika telat karena ada masalah ketika di perjalanan apakah tetap boleh masuk?
    - Bagaimana cara mengurus izin tidak hadir praktikum?
    - Jika tidak hadir praktikum apakah boleh susulan?
    - Apakah kehadiran mempengaruhi nilai praktikum?
    - Kalau telat apakah dihitung alfa?
    - Apakah boleh telat praktikum?
    - Apakah ada batas waktu telat ketika praktikum?
    - Jika telat apakah dihitung alfa?
    - Apakah absensi praktikum menentukan kelulusan praktikum?
    - Jika kehadiran praktikum kurang apakah ada pengaruhnya?
    - Apakah jumlah hadir praktikum mempengaruhi status praktikan?
    - Bagaimana dampak absen praktikum terhadap penilaian?
    - Apakah daftar hadir praktikum diperhitungkan?

# =========================
# NILAI PRAKTIKUM
# =========================
- intent: tanya_nilai_praktikum
  examples: |
    - Bagaimana sistem penilaian praktikum?
    - Apakah nilai bisa dirubah ketika asisten salah memberikan nilai praktikum?
    - Bagaimana cara mengurus terkait penilaian jika ingin mengganti jadwal pada praktikum?
    - Bagaimana cara mengurus nilai jika ingin mengganti jadwal praktikum?
    - Bagaimana jika nilai matkul rendah namun nilai praktikum tinggi?
    - Berapa persen nilai praktikum untuk menambah nilai matkul?
    - Apakah nilai praktikum mempengaruhi nilai responsi?
    - Jika nilai praktikum salah bagaimana?
    - Apakah nilai praktikum bisa direvisi?
    - Bagaimana jika nilai akhir praktikum tidak sesuai?
    - Apakah komponen nilai praktikum bisa ditanyakan ulang?
    - Kalau ada kesalahan input nilai praktikum harus bagaimana?
    - Apakah nilai praktikum menentukan nilai akhir mata kuliah?
    - Bagaimana cara mengetahui bobot nilai praktikum?

# =========================
# PERALATAN PRAKTIKUM
# =========================
- intent: tanya_peralatan_praktikum
  examples: |
    - Perlu bawa modul ngak ketika praktikum?
    - Apakah perlu laptop sendiri?
    - Bisa ngak saya membawa laptop ke lab?
    - Apakah wajib membawa modul?
    - Apakah boleh membawa catatan praktikum?
    - Praktikum harus membawa laptop sendiri?
    - Apakah lab menyediakan kertas tulis praktikum?
    - Apa perlengkapan yang wajib dibawa praktikan?
    - Saat praktikum harus membawa alat tulis sendiri?
    - Apakah perlengkapan praktikum disediakan oleh laboratorium?
    - Apakah praktikan perlu menyiapkan kertas sendiri?
    - Barang pendukung apa yang perlu dibawa ke lab?
    - Apakah modul, laptop, dan alat tulis harus dibawa?
    - Apakah catatan praktikum termasuk perlengkapan yang boleh dibawa?
    - Kalau tidak membawa modul praktikum apakah bermasalah?

# =========================
# ONLINE PRAKTIKUM
# =========================
- intent: tanya_online_praktikum
  examples: |
    - Apakah ada praktikum yang online?
    - Semua praktikum apakah dilakukan offline?
    - Ketika praktikum apakah boleh buka AI?
    - Apa aja aturan ketika melakukan praktikum secara online?
    - Bagaimana solusi jika internet bermasalah pada praktikum?
    - Praktikum online menggunakan apa?
    - Apakah praktikum boleh menggunakan ChatGPT?
    - Apakah praktikum dilaksanakan daring atau luring?
    - Praktikum harus datang ke lab atau bisa online?
    - Apakah ada opsi praktikum jarak jauh?
    - Bagaimana ketentuan hadir untuk praktikum online?
    - Jika praktikum online apakah tetap wajib absen?

# =========================
# PENDAFTARAN PRAKTIKUM
# =========================
- intent: tanya_pendaftaran_praktikum
  examples: |
    - Bagaimana tahapan mendaftar praktikum?
    - Bagaimana cara daftar praktikum?
    - Kapan pendaftaran praktikum dibuka?
    - Bagaimana prosedur mengikuti praktikum?
    - Dimana daftar praktikum?
    - Bagaimana cara mengambil praktikum?
    - Bagaimana jika telat mendaftar praktikum?
    - Kapan waktu pendaftaran praktikum?
    - Bagaimana prosedur pendaftaran praktikum untuk mahasiswa baru?
    - Apa syarat ikut praktikum?
    - Apakah kuota pendaftaran praktikum terbatas?
    - Apa saja syarat administrasi mengikuti praktikum di awal semester?
    - Apakah bisa memilih ulang ketika jadwal slot praktikum sudah habis?
    - Apa saja yang harus dipersiapkan untuk mendaftar praktikum?
    - Kenapa pendaftaran mata kuliah praktikum bayar?
    - Dimana tempat untuk mendaftar praktikum?
    - Bisa daftar praktikum telat?
    - Kapan batas akhir pendaftaran praktikum biasanya ditutup?
    - Link pendaftaran praktikum di mana?
    - Kalau telat daftar apakah masih bisa ikut?
    - Kapan buka pendaftaran praktikum?
    - Cara daftar praktikum lewat mana?
    - Bagaimana prosedur terkait pendaftaran praktikum jika terlambat?

# =========================
# LAB DAN PEMINJAMAN
# =========================
- intent: tanya_peminjaman_lab
  examples: |
    - Bagaimana prosedur jika ingin meminjam alat lab?
    - Jika alat yang digunakan rusak saat praktikum berlangsung bukan karena kelalaian praktikan bagaimana?
    - Apakah boleh meminjam alat laboratorium?
    - Bagaimana aturan peminjaman alat lab?
    - Siapa yang bertanggung jawab jika alat rusak?
    - Bagaimana cara menggunakan fasilitas lab di luar jam praktikum?
    - Apakah alat laboratorium boleh dipakai untuk keperluan tugas?
    - Jika ingin memakai lab tambahan harus izin ke siapa?
    - Bagaimana prosedur pemakaian alat lab selain jadwal kelas?
    - Apakah fasilitas laboratorium bisa dipinjam mahasiswa?

# =========================
# KELULUSAN PRAKTIKUM
# =========================
- intent: tanya_kelulusan_praktikum
  examples: |
    - Apakah harus lulus matkul untuk lulus praktikum?
    - Ketika matkul tidak lulus apakah praktikum juga tidak lulus?
    - Apakah praktikum dan matkul saling mempengaruhi?
    - Bagaimana syarat lulus praktikum?
    - Apakah nilai praktikum terpisah dari matkul?
    - Apakah bisa mengulang praktikum?
    - Apa saja ketentuan agar praktikum dinyatakan lulus?
    - Jika nilai mata kuliah tidak lulus apakah status praktikum tetap berlaku?
    - Apakah kelulusan praktikum dihitung sendiri dari teori?
    - Kalau gagal praktikum apakah harus mengambil ulang?
    - Apakah praktikum punya syarat kelulusan tersendiri?
